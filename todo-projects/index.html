<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #09090b;
            color: white;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: #18181b;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            background: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            border-radius: 5px;
            outline: none;
        }

        button {
            padding: 10px 18px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        ul {
            padding: 0;
            list-style: none;
            margin-top: 25px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px;
            margin-bottom: 10px;
            background: #27272a;
            border-radius: 5px;
        }

        li.completed {
            text-decoration: line-through;
            opacity: 0.5;
            pointer-events: none;
        }

        .delete-btn {
            background: #dc2626;
            padding: 7px 12px;
        }

        .edit-btn {
            background: #26dc72;
            padding: 7px 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>My Todo List</h2>

        <form id="todoForm" class="input-section">
            <input type="text" id="todoInput" placeholder="Enter a task...">
            <button id="submitBtn" type="submit">Add</button>
        </form>

        <ul id="todoList"></ul>

    </div>
    <script src="script.js"></script>
</body>

</html>
